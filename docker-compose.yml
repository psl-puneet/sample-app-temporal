version: "3.8"
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: temporal
      MYSQL_DATABASE: temporal
    
    ports:
      - "3306:3306"

  temporal:
    image: temporalio/auto-setup
    depends_on:
      - mysql
    environment:
      - DB=mysql8
      - DB_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PWD=temporal
      - MYSQL_SEEDS=mysql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"

  app:
    build: .
    depends_on:
      - temporal
    environment:
      - TEMPORAL_SERVER=temporal:7233
    ports:
      - "8000:8000"
    command: uvicorn app:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    depends_on:
      - temporal
      - mysql
    environment:
      - TEMPORAL_SERVER=temporal:7233
    command: python worker.py
